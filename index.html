<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenda Sabha Arena — Verified Input and Mouse Look Fix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
:root{--bg:#0b0f1e;--fg:#f4f6ff;--a:#37c8ff;--b:#ff5a3c;--gold:#ffd24a;--panel:rgba(10,14,30,.82);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f1e;--fg:#f4f6ff;--panel:rgba(10,14,30,.82)}}
:root[data-theme="dark"]{--bg:#0b0f1e;--fg:#f4f6ff;--panel:rgba(10,14,30,.82)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0}#c canvas{display:block;width:100%;height:100%}
.h{font-family:Bungee,Impact,"Arial Black",sans-serif;letter-spacing:.02em}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:none;gap:10px;padding:10px;align-items:flex-start;pointer-events:none}
.team{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bar{position:relative;height:20px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.6);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
.A .bar i{background:var(--a)}.B .bar i{background:var(--b);margin-left:auto}
.bar b{position:absolute;top:0;font-size:11px;line-height:16px;padding:0 6px;text-shadow:0 1px 2px #000}
.A .bar b{left:0}.B .bar b{right:0}
#mid{width:84px;text-align:center}#tm{font-size:30px;line-height:1}#w{font-size:14px;margin-top:4px;letter-spacing:3px}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(20px,4.8vw,48px);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.6);display:none;padding:0 12px}
#banner small{display:block;font-family:system-ui,sans-serif;font-size:clamp(13px,2vw,18px);margin-top:10px;letter-spacing:0;text-shadow:0 1px 3px #000}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow:auto}
#menu{background:radial-gradient(ellipse at center,rgba(11,15,30,.5),rgba(11,15,30,.93))}
#pause{display:none;background:rgba(5,7,16,.8)}
.ov h1{margin:0;font-size:clamp(34px,8vw,80px);line-height:1;text-shadow:0 5px 0 #000}.ov h1 span{color:var(--gold)}
.ov h2{margin:0;font-size:clamp(20px,4vw,34px)}
.ov p{margin:0;max-width:520px;opacity:.85;font-size:14px;line-height:1.5}
.btn{font-family:Bungee,Impact,sans-serif;font-size:16px;color:#0b0f1e;background:var(--gold);border:0;border-radius:6px;padding:13px 20px;min-width:min(340px,86vw);cursor:pointer;box-shadow:0 5px 0 #a8841a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8841a}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--a);box-shadow:0 5px 0 #1c7ea0}.btn.on{outline:3px solid #fff}
.btn:focus-visible,.ch:focus-visible{outline:3px solid #fff;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;width:min(640px,92vw)}
.ch{font-family:Bungee,Impact,sans-serif;font-size:13px;color:var(--fg);background:var(--panel);border:2px solid rgba(255,255,255,.25);border-radius:8px;padding:10px 6px;cursor:pointer}
.ch i{display:block;height:34px;border-radius:5px;margin-bottom:8px}.ch.on{border-color:var(--gold)}
.keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12.5px}
.keys div{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px;text-align:left;line-height:1.5}.keys b{color:var(--gold)}
#code{font-family:Bungee,Impact,sans-serif;font-size:18px;text-transform:uppercase;text-align:center;width:130px;padding:11px;border-radius:6px;border:2px solid var(--a);background:var(--panel);color:var(--fg)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#menuBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;font-family:Bungee,Impact,sans-serif;font-size:13px;padding:10px 16px;border-radius:6px;border:2px solid #fff;background:var(--panel);color:var(--fg);cursor:pointer}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:8px 14px;border-radius:6px;font-size:13px;display:none;max-width:90vw;text-align:center}
#soundBtn{position:fixed;left:14px;top:74px;z-index:30;display:none;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:9px 12px;background:rgba(8,14,30,.88);color:#fff;font:800 11px system-ui;cursor:pointer;box-shadow:0 0 14px rgba(154,76,255,.18)}#soundBtn.muted{opacity:.65;border-color:#ff7b7b}
#cameraLockBtn{position:fixed;right:14px;top:74px;z-index:30;display:none;border:1px solid rgba(255,255,255,.65);border-radius:8px;padding:9px 12px;background:rgba(8,14,30,.88);color:#fff;font:800 11px system-ui;cursor:pointer;box-shadow:0 0 14px rgba(55,200,255,.18)}#cameraHint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:20;display:none;padding:7px 11px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(5,9,20,.7);color:#dbe9ff;font-size:11px;text-align:center;pointer-events:none;white-space:nowrap}body.pointer-locked #cameraLockBtn{border-color:#37c8ff;color:#7edfff;box-shadow:0 0 16px rgba(55,200,255,.35)}@media(pointer:coarse){#cameraLockBtn{display:none!important}#cameraHint{bottom:144px;white-space:normal;max-width:75vw}}
#tc{display:none;position:fixed;left:0;right:0;bottom:0;height:0}@media (pointer:coarse){#tc{display:block}}
#stick{position:fixed;left:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#btns{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end}
#btns button{touch-action:none;font-family:Bungee,Impact,sans-serif;font-size:12px;width:70px;height:70px;border-radius:50%;border:2px solid #fff;color:#fff;background:rgba(255,90,60,.55)}
#btns button[data-k=kick]{background:rgba(255,210,74,.5);margin-bottom:34px}#btns button[data-k=block]{background:rgba(55,200,255,.5)}#btns button[data-k=s]{background:rgba(154,76,255,.78);width:82px;height:82px}#btns button[data-k=jump]{background:rgba(80,210,130,.65);margin-bottom:24px}#btns button[data-k=sprint]{background:rgba(255,160,55,.72);margin-bottom:18px}
@media(pointer:coarse){#btns{right:10px;gap:6px;flex-wrap:wrap;max-width:54vw;justify-content:flex-end}#btns button{width:58px;height:58px;font-size:10px}#stick{width:108px;height:108px}#knob{left:31px;top:31px;width:46px;height:46px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* Updated fighter-select layout and game overlays */
#menu.selection-mode{display:block;padding:0;overflow:auto;text-align:left;background:radial-gradient(ellipse at 50% 42%,rgba(15,35,62,.94),rgba(4,7,18,.98) 72%)}
.select-shell{box-sizing:border-box;min-height:100%;width:100%;padding:clamp(12px,2vw,26px);display:flex;flex-direction:column;gap:14px;color:#f4f6ff}
.select-top{display:flex;align-items:center;gap:16px;min-height:48px;max-width:1500px;width:100%;margin:0 auto}
.select-back{border:1px solid rgba(255,255,255,.25);background:rgba(10,18,35,.9);color:#dceaff;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
.select-heading{flex:1;min-width:0;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:clamp(21px,3.3vw,38px);letter-spacing:.03em;color:#ffd24a;text-shadow:0 3px 0 #000}
.select-heading small{display:block;font:600 11px system-ui,sans-serif;letter-spacing:.04em;color:#b9c7dd;text-shadow:none;margin-top:2px}
.select-status{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.select-chip{border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 9px;font-size:10px;font-weight:800;color:#c9d7ed;background:rgba(15,22,42,.86);white-space:nowrap}
.select-stage{width:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(165px,.9fr) minmax(390px,2.2fr) minmax(165px,.9fr);gap:12px;align-items:stretch;flex:1}
.fighter-preview{--accent:#37c8ff;box-sizing:border-box;min-width:0;min-height:295px;align-self:center;padding:12px;border:1px solid var(--accent);border-radius:14px;background:linear-gradient(155deg,rgba(12,35,58,.92),rgba(7,11,25,.94));box-shadow:0 0 22px color-mix(in srgb,var(--accent) 18%,transparent);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px}
.fighter-preview.red{--accent:#ff4e78;background:linear-gradient(155deg,rgba(58,10,29,.94),rgba(13,8,24,.96))}
.preview-label{align-self:stretch;border-radius:5px;background:var(--accent);color:#06101b;font-size:10px;font-weight:1000;padding:5px;letter-spacing:.05em}
.preview-photo{display:block;width:min(100%,180px);height:clamp(120px,22vh,190px);object-fit:cover;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:#12182c}
.fighter-preview h3{font-family:Bungee,Impact,sans-serif;font-size:clamp(17px,2vw,25px);color:var(--accent);margin:3px 0 0}
.preview-special{font-size:10px;font-weight:1000;color:#ffd24a;text-transform:uppercase;letter-spacing:.04em}
.preview-desc{font-size:11px;line-height:1.4;color:#d4deef;max-width:230px;margin:0}
.preview-placeholder{width:min(100%,180px);height:clamp(120px,22vh,190px);display:grid;place-items:center;border-radius:9px;border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);font-size:38px;color:#8592ad}
.select-center{min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.slot-tabs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.slot-tab{background:rgba(16,23,42,.96);border:1px solid rgba(255,255,255,.18);color:#d6e2f6;border-radius:7px;padding:8px 11px;font-size:10px;font-weight:900;cursor:pointer}
.slot-tab.active.player{border-color:#37c8ff;color:#70dcff;box-shadow:0 0 12px rgba(55,200,255,.2)}
.slot-tab.active.bot{border-color:#ff4e78;color:#ff91aa;box-shadow:0 0 12px rgba(255,78,120,.2)}
.select-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-height:min(49vh,430px);overflow:auto;padding:2px 4px 5px}
.fighter-card{position:relative;min-width:0;padding:6px;border-radius:11px;background:linear-gradient(155deg,rgba(24,33,55,.98),rgba(9,14,29,.98));border:1px solid rgba(255,255,255,.12);color:#f4f6ff;cursor:pointer;text-align:center;transition:transform .12s,border-color .12s,box-shadow .12s}
.fighter-card:hover{transform:translateY(-2px);border-color:#ffd24a}
.fighter-card.selected{border:2px solid var(--slot-color,#37c8ff);box-shadow:0 0 15px color-mix(in srgb,var(--slot-color,#37c8ff) 30%,transparent)}
.fighter-card .card-photo{width:100%;height:clamp(72px,13vh,135px);display:block;object-fit:cover;border-radius:7px;background:#11182c}
.fighter-card .card-name{display:block;font-family:Bungee,Impact,sans-serif;font-size:clamp(10px,1.1vw,13px);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fighter-card .card-special{display:block;color:#ffd24a;font-size:8px;font-weight:1000;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fighter-card .pick-tag{position:absolute;top:9px;left:9px;background:#37c8ff;color:#00101c;border-radius:4px;padding:3px 5px;font-size:8px;font-weight:1000}
.random-card{display:flex;min-height:100%;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(155deg,#18123a,#090b20);border-color:#704bd1;color:#d8c5ff;font-weight:1000;font-size:11px}
.random-die{font-size:32px}
.select-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1500px;width:100%;margin:0 auto;padding:9px 12px;border:1px solid rgba(255,255,255,.11);border-radius:12px;background:rgba(13,19,37,.9)}
.bot-settings{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px;font-weight:900;color:#c7d4e8}
.bot-settings button{border:1px solid rgba(255,255,255,.13);background:#253047;color:#e5edff;border-radius:6px;padding:7px 9px;font-size:10px;font-weight:900;cursor:pointer}
.bot-settings button.active{background:#ffca48;color:#17131b;border-color:#ffd24a}
#startFight{border:0;border-radius:9px;padding:12px 23px;min-width:190px;background:linear-gradient(100deg,#ffce3b,#ff4c35);color:#170b12;font-family:Bungee,Impact,sans-serif;font-size:15px;box-shadow:0 5px 0 #8d342c;cursor:pointer}
#startFight:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
#btns button[data-k=s]{background:rgba(137,75,255,.72);border-color:#c8aaff;font-size:10px}
#btns button{width:62px;height:62px}
.ch{padding:8px}
.ch .lobby-face{display:block;width:100%;height:70px;object-fit:cover;border-radius:5px;margin-bottom:7px}
@media(max-width:850px){
 .select-stage{grid-template-columns:1fr 1fr;grid-template-areas:'left right' 'center center';align-items:start}
 .fighter-preview{min-height:0;padding:8px}.fighter-preview .preview-photo,.preview-placeholder{height:105px;width:100%;max-width:160px}
 .fighter-preview:first-child{grid-area:left}.fighter-preview:last-child{grid-area:right}.select-center{grid-area:center}.select-grid{max-height:42vh}
 .select-status{display:none}
 .select-bottom{align-items:stretch;flex-direction:column}
 #startFight{width:100%}
}
@media(max-width:520px){
 .select-shell{padding:9px;gap:9px}.select-top{gap:7px}.select-heading{font-size:18px}.select-heading small{font-size:9px}
 .select-back{font-size:10px;padding:8px}.select-stage{gap:7px}.fighter-preview h3{font-size:15px}.preview-desc{font-size:9px}
 .select-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:44vh}
 .fighter-card{padding:4px}.fighter-card .card-photo{height:82px}.fighter-card .card-name{font-size:9px}.fighter-card .card-special{font-size:7px}
 .slot-tab{padding:7px 8px;font-size:9px}
 .bot-settings{justify-content:center}
 #btns{right:8px;gap:5px}#btns button{width:53px;height:53px;font-size:9px}
}


.fighter-hud{display:flex;flex-direction:column;gap:3px}
.special-bar{height:6px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:4px;overflow:hidden}
.special-bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#9a4cff,#e0aaff);transition:width .15s}

</style>
</head>
<body>
<div id="c"></div>
<div id="hud"><div class="team A" id="tA"></div><div id="mid"><div id="tm" class="h">60</div><div id="w"></div></div><div class="team B" id="tB"></div></div>
<div id="banner" class="h"></div><div id="toast"></div>
<button id="soundBtn" type="button">🔊 SOUND ON</button><button id="cameraLockBtn" type="button">🔒 LOCK MOUSE</button><div id="cameraHint">CLICK ARENA TO LOCK MOUSE · ESC TO UNLOCK · TOUCH DRAG ON MOBILE</div>
<button id="menuBtn">☰ MENU</button>
<div id="menu" class="ov"></div>
<div id="pause" class="ov"><h2 class="h">Menu</h2><button class="btn" id="resume">Resume</button><button class="btn alt" id="quit">Quit to main menu</button></div>
<div id="tc"><div id="stick"><i id="knob"></i></div><div id="btns"><button data-k="block">BLOCK</button><button data-k="kick">KICK</button><button data-k="punch">PUNCH</button><button data-k="jump">JUMP</button><button data-k="sprint">RUN</button><button data-k="s">SPECIAL</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const TC={A:0x37c8ff,B:0xff5a3c},R=22;

{n:'HAMMAD',c:0x2a9d8f,p:0x0e3b36,h:0x16161c,s:2,special:'SIGNATURE BURST',desc:'A short-range energy burst.'},
{n:'KRISHIV',c:0x4361ee,p:0x14205c,h:0x6b3a1e,s:3,special:'SIGNATURE BURST',desc:'A short-range energy burst.'},
{n:'VIVAN',c:0x9b5de5,p:0x34195a,h:0x16161c,s:4,special:'SIGNATURE BURST',desc:'A short-range energy burst.'},
{n:'ARSH',c:0xf15bb5,p:0x5a1a40,h:0xe9e9e9,s:5,special:'SIGNATURE BURST',desc:'A short-range energy burst.'},

/* Standalone multiplayer transport. When this game is hosted by the Lenda Sabha
   server, rooms use its WebSocket service and do not depend on Claude. */
function createWebSocketRoomService(){
  return {
    join(roomName){
      return new Promise((resolve,reject)=>{
        if(!/^https?:$/.test(location.protocol)){reject(new Error('Open the hosted game URL to use online multiplayer'));return}
        const scheme=location.protocol==='https:'?'wss:':'ws:';
        const socketUrl=scheme+'//'+location.host+'/ws';
        let ws;
        try{ws=new WebSocket(socketUrl)}catch(e){reject(new Error('Could not create the online connection'));return}
        let settled=false,peerId='',peerList=[];
        let seq=0;
        const pending=new Map(),listeners=new Map(),peerListeners=new Set();
        const notifyPeers=()=>peerListeners.forEach(fn=>{try{fn()}catch(e){console.warn('Peer listener failed:',e)}});
        const peerSignature=list=>(list||[]).map(p=>{
          const pr=p.presence||{};return String(p.peer||'')+':'+String(pr.c??'')+':'+String(!!pr.host)+':'+String(!!pr.ready);
        }).sort().join('|');
        const setPeers=list=>{
          const before=peerSignature(peerList);
          peerList=(Array.isArray(list)?list:[]).map(p=>({
            peer:String(p.peer||''),isMe:String(p.peer||'')===peerId,
            sameTab:String(p.peer||'')===peerId,kind:'viewer',
            presence:p.presence&&typeof p.presence==='object'?p.presence:{}
          })).filter(p=>p.peer);
          if(before!==peerSignature(peerList))notifyPeers();
        };
        const request=(type,data={})=>{
          if(ws.readyState!==WebSocket.OPEN)return Promise.reject(new Error('Online server is disconnected'));
          const id='req-'+(++seq)+'-'+Math.random().toString(36).slice(2,7);
          return new Promise((res,rej)=>{
            const timer=setTimeout(()=>{pending.delete(id);rej(new Error('Online server did not respond'))},type==='join'?40000:9000);
            pending.set(id,{resolve:res,reject:rej,timer});
            try{ws.send(JSON.stringify(Object.assign({type,id},data)))}catch(e){clearTimeout(timer);pending.delete(id);rej(e)}
          });
        };
        const api={
          peers:()=>peerList.slice(),
          presence(payload){return request('presence',{presence:payload||{}})},
          emit(event,payload){return request('emit',{event:String(event),data:payload||{}})},
          on(event,fn){if(!listeners.has(event))listeners.set(event,[]);listeners.get(event).push(fn)},
          onPeers(fn){peerListeners.add(fn)},
          leave(){try{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'leave'}))}catch(e){}try{ws.close(1000,'left room')}catch(e){}peerList=[];notifyPeers()}
        };
        ws.addEventListener('open',()=>{
          request('join',{room:String(roomName)}).then(data=>{
            if(settled)return;settled=true;peerId=String(data.peerId||'');setPeers(data.peers||[]);resolve(api);
          }).catch(err=>{if(!settled){settled=true;try{ws.close()}catch(e){}reject(err)}});
        });
        ws.addEventListener('message',ev=>{
          let msg;try{msg=JSON.parse(ev.data)}catch(e){return}
          if(msg.type==='response'){
            const item=pending.get(msg.id);if(!item)return;
            clearTimeout(item.timer);pending.delete(msg.id);
            if(msg.ok)item.resolve(msg.data||{});else item.reject(new Error(msg.error||'Online request failed'));
          }else if(msg.type==='peers')setPeers(msg.peers||[]);
          else if(msg.type==='event'){
            (listeners.get(msg.event)||[]).forEach(fn=>{try{fn({data:msg.data,from:msg.from})}catch(e){console.error('Online event handler failed:',e)}});
          }
        });
        ws.addEventListener('error',()=>{if(!settled){settled=true;reject(new Error('Could not connect to the online server'))}});
        ws.addEventListener('close',()=>{
          pending.forEach(item=>{clearTimeout(item.timer);item.reject(new Error('Online connection closed'))});pending.clear();
          if(!settled){settled=true;reject(new Error('Online server closed the connection'))}
          peerList=[];notifyPeers();
        });
      });
    }
  };
}

  o.connect(g);g.connect(audioMaster);o.start(t);o.stop(t+duration+.03);

function humanInput(n){
  const m=KM[n];let p=0,k=0,b=0,s=0,jump=0,sprint=!!(keys.ShiftLeft||keys.ShiftRight),mx=0,mz=0;
  p=!!keys[m.p];k=!!keys[m.k];b=!!keys[m.b];s=!!keys[m.s];jump=!!keys.Space;
  if(n===0){
    // Roblox-style third-person controls: camera orbit is independent of the fighter.
    // W/S follow the camera's ground-facing direction; A/D strafe across the screen.
    const viewForward=camera.getWorldDirection(new THREE.Vector3());
    viewForward.y=0;
    if(viewForward.lengthSq()>.0001)viewForward.normalize();else viewForward.set(0,0,-1);
    const screenRight=new THREE.Vector3().crossVectors(viewForward,new THREE.Vector3(0,1,0)).normalize();

    const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-touch.mz;
    const move=screenRight.multiplyScalar(side).add(viewForward.multiplyScalar(forward));
    mx=move.x;mz=move.z;

    k=k||!!touch.kick||mouseAction.kickHeld||performance.now()<mouseAction.kickUntil;
    b=b||!!touch.block;s=s||!!touch.s;jump=jump||!!touch.jump;sprint=sprint||!!touch.sprint;

    if(typeof net.onPeers==='function')net.onPeers(()=>{if(screen==='lobby')lobby();else if(state==='fight'&&isHost)toast('ONLINE PLAYER LIST UPDATED')});
    lobby();
  }catch(e){console.error('Online join failed:',e);try{if(net)net.leave()}catch(_){}net=null;toast('COULD NOT JOIN ROOM · '+(e&&e.message?e.message:'CHECK ROOM SERVICE'));}
}
function lobby(){
  if(!net){main();return}
  screen='lobby';const ps=onlineViewers().filter(p=>!(p.isMe&&!p.sameTab));
  const myPeer=ps.find(p=>p.isMe&&(p.sameTab||p.kind==='viewer'))||ps.find(p=>p.isMe);
  if(myPeer&&myPeer.presence&&Number.isInteger(myPeer.presence.c))myChar=myPeer.presence.c;
  lastLobbySignature=ps.map(p=>String(p.peer)+':'+String((p.presence&&p.presence.c)||0)+':'+String(!!(p.presence&&p.presence.host))).sort().join('|');
  const otherCount=ps.filter(p=>!p.isMe).length,canStart=isHost&&otherCount>=1;
  show('<h2 class="h">Room '+roomCode+' · '+(cfg.size===1?'1v1':'2v2')+'</h2><p>Share this code with your opponent: <b style="color:var(--gold);font-size:24px;letter-spacing:4px">'+roomCode+'</b></p><p>Connected players: '+ps.length+' · Choose your fighter below.</p><div class="keys">'+ps.map(p=>'<div>'+(p.isMe?'You':'Player')+': <b>'+CHARS[((p.presence&&p.presence.c)||0)|0].n+'</b>'+(p.presence&&p.presence.host?' (host)':'')+'</div>').join('')+'</div>'+GRID(myChar)+(isHost?'<button class="btn" data-a="go"'+(canStart?'':' disabled')+'>START MATCH ('+ps.length+' CONNECTED)</button>':'<p>Waiting for the host to start…</p>')+'<button class="btn alt" data-a="back">Leave room</button>');
}
function startHost(){
  if(!net||!isHost){toast('ONLY THE ROOM HOST CAN START THE MATCH');return}
  const peers=onlineViewers(),me=peers.find(p=>p.isMe&&(p.sameTab||p.kind==='viewer'))||peers.find(p=>p.isMe);
  if(!me){toast('HOST CONNECTION NOT READY · REJOIN THE ROOM');return}
  const others=peers.filter(p=>!p.isMe).sort((a,b)=>String(a.peer).localeCompare(String(b.peer)));
  if(!others.length){toast('WAITING FOR ANOTHER PLAYER TO JOIN');return}
  const players=[me,...others],slots=cfg.size>1?[['A',0],['B',0],['A',1],['B',1]]:[['A',0],['B',0]],used=[];
  const roster=slots.map((slot,i)=>{
    if(i<players.length){const p=players[i],pr=p.presence||{};return{t:slot[0],s:slot[1],o:p.peer,c:Number.isInteger(pr.c)?pr.c:0,a:0}}
    return{t:slot[0],s:slot[1],o:me.peer,c:rnd(used),a:1};
  });
  const matchId='match-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const startData={id:matchId,size:cfg.size,roster};
  startOnline(startData);
  roomEmit('go',startData).catch(()=>toast('MATCH START COULD NOT REACH THE OTHER PLAYER · TRY AGAIN'));
}
function startOnline(d){
  if(!d||!Array.isArray(d.roster)||!net){toast('ONLINE MATCH DATA IS NOT READY');return}
  const me=roomPeers().find(p=>p.isMe&&(p.sameTab||p.kind==='viewer'))||roomPeers().find(p=>p.isMe);
  if(!me){toast('THIS PLAYER IS NOT REGISTERED IN THE ROOM');return}
  if(d.id&&activeMatchId===d.id&&state!=='lobby'&&state!=='menu')return;
  activeMatchId=d.id||('match-'+roomCode+'-'+d.roster.length);
  ME=me.peer;cfg={size:d.size===2?2:1,humans:1};
  // Reset local network state before building both clients from the same roster.
  F.forEach(f=>scene.remove(f.g));F.length=0;seenRoomEvents.clear();begin(d.roster);
  roomPresence({c:myChar,host:isHost,size:cfg.size,ready:true,matchId:activeMatchId,fs:[]}).catch(()=>{});
}
function pub(){
  if(!net||!F.length)return;
  const fs=[];
  F.forEach(f=>{if(!f.remote)fs.push([f.idx,+f.x.toFixed(3),+f.z.toFixed(3),+f.yaw.toFixed(3),Math.round(f.hp),f.ko?1:0,f.atk||'',+(f.at||0).toFixed(3),f.blocking?1:0,f.mv,+Math.max(0,f.stun).toFixed(2),+(f.jumpOffset||0).toFixed(2),f.jumping?1:0,+f.sp.toFixed(1),+(f.specialTimer||0).toFixed(2),f.char,+f.y.toFixed(2)])});
  roomPresence({c:myChar,host:isHost,size:cfg.size,ready:true,matchId:activeMatchId,fs,rt:+rt.toFixed(2),round,wins,state}).catch(()=>{});
}
$('menu').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='s11'||a==='s22'||a==='loc'){cfg={size:a==='s11'?1:2,humans:a==='loc'?2:1};picks=[];pickFor=0;pickSlot=0;showPick()}
  else if(a==='pick'){const i=+t.dataset.i;picks[pickSlot]=i;if(pickSlot===0)pickSlot=1;showPick()}
  else if(a==='slot'){pickSlot=+t.dataset.i;showPick()}
  else if(a==='random'){picks[1]=null;pickSlot=1;showPick()}
  else if(a==='botmode'){botMode=t.dataset.v;showPick()}
  else if(a==='start'){if(picks[0]===undefined||(cfg.humans>1&&picks[1]===undefined))return;beginLocal()}
  else if(a==='ch'){const i=+t.dataset.i;if(screen==='lobby'&&net){myChar=i;roomPresence({c:i,host:isHost,size:cfg.size,ready:true}).then(()=>lobby()).catch(()=>toast('COULD NOT UPDATE YOUR FIGHTER'));}}
  else if(a==='onl'){picks=[0];onlMenu()}
  else if(a==='f1'||a==='f2'){cfg.size=a==='f1'?1:2;onlMenu()}
  else if(a==='mk'||a==='jn'){cfg.humans=1;const code=a==='mk'?Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join(''):$('code').value;joinRoom(code,a==='mk')}
  else if(a==='go')startHost();
  else if(a==='back'){if(net){try{net.leave()}catch(x){}net=null}activeMatchId=null;isHost=false;main()}});
main();

/* Third-person camera: high-sensitivity mouse look, robust pointer-lock attempts, and drag fallback. */
const look=new THREE.Vector3(0,1,0);
let camYaw=-Math.PI/2,camPitch=.2,dragCam=false,lastPX=0,lastPY=0,cameraLocked=false,cameraUnlockAt=0,dragPointerId=null;
const canvas=ren.domElement;canvas.style.touchAction='none';canvas.style.cursor='grab';
function matchIsTouch(){return window.matchMedia&&window.matchMedia('(pointer:coarse)').matches}
function applyCameraLook(dx,dy){
  const sensitivity=0.024; // 3.2x the previous horizontal sensitivity
  camYaw-=dx*sensitivity;
  camPitch=Math.max(-.28,Math.min(.96,camPitch+dy*.016));
}
function setCameraHint(t){const h=$('cameraHint');if(h)h.textContent=t}
function requestCameraLock(){
  if(matchIsTouch())return;
  if(document.pointerLockElement){document.exitPointerLock();return;}
  // Lock the page body so mouse look continues even when the cursor is over HUD elements.
  // The renderer canvas is a fallback for browsers that reject body as the lock target.
  const primary=document.body;
  try{
    if(primary&&typeof primary.requestPointerLock==='function'){
      const result=primary.requestPointerLock();
      if(result&&typeof result.catch==='function')result.catch(()=>tryCanvasLock());
      return;
    }
  }catch(err){console.warn('Body pointer-lock request failed:',err);}
  tryCanvasLock();
}
function tryCanvasLock(){
  try{
    if(canvas&&typeof canvas.requestPointerLock==='function'){
      const result=canvas.requestPointerLock();
      if(result&&typeof result.catch==='function')result.catch(()=>setCameraHint('POINTER LOCK IS BLOCKED IN THIS EMBEDDED PREVIEW · HOLD MIDDLE MOUSE AND DRAG OR OPEN THE DOWNLOADED HTML IN CHROME'));
      return;
    }
  }catch(err){console.warn('Canvas pointer-lock request failed:',err);}
  setCameraHint('POINTER LOCK IS UNAVAILABLE HERE · HOLD LEFT/RIGHT MOUSE AND DRAG');
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Use document-level pointer events: when Pointer Lock is active the event target
// can be BODY (the lock element), not the renderer canvas. A canvas-only listener
// silently drops Player 1's mouse punch/kick in that mode.
function isGamePointerEvent(e){
  const onCanvas=e.target===canvas||canvas.contains(e.target);
  return onCanvas||cameraLocked||document.pointerLockElement===document.body;
}
document.addEventListener('pointerdown',e=>{
  if(state!=='fight')return;
  if(e.pointerType==='mouse'){
    if(!isGamePointerEvent(e))return;
    if(e.button===0){mouseAction.punchHeld=true;mouseAction.punchUntil=performance.now()+360;e.preventDefault();return;}
    if(e.button===2){mouseAction.kickHeld=true;mouseAction.kickUntil=performance.now()+360;e.preventDefault();return;}
    // Middle mouse is reserved for camera drag so the two attack buttons stay free.
    if(e.button!==1)return;
  }else if(!isGamePointerEvent(e))return;
  dragCam=true;dragPointerId=e.pointerId;lastPX=e.clientX;lastPY=e.clientY;canvas.style.cursor='grabbing';
  try{if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
// Mouse-event fallback for browsers/previews that retarget or suppress Pointer Events
// while the page body is pointer-locked. The short queue avoids missed click frames.
document.addEventListener('mousedown',e=>{
  if(state!=='fight'||!cameraLocked)return;
  if(e.button===0){mouseAction.punchUntil=performance.now()+360;e.preventDefault();}
  else if(e.button===2){mouseAction.kickUntil=performance.now()+360;e.preventDefault();}
});
document.addEventListener('contextmenu',e=>{if(cameraLocked&&state==='fight')e.preventDefault()});
document.addEventListener('pointermove',e=>{
  if(!dragCam||e.pointerId!==dragPointerId||cameraLocked)return;
  applyCameraLook(e.clientX-lastPX,e.clientY-lastPY);lastPX=e.clientX;lastPY=e.clientY;
});
function endCameraDrag(e){
  if(e&&e.pointerType==='mouse'){
    if(e.button===0)mouseAction.punchHeld=false;
    if(e.button===2)mouseAction.kickHeld=false;
  }
  if(dragPointerId!==null&&e&&e.pointerId!==undefined&&e.pointerId!==dragPointerId)return;
  dragCam=false;dragPointerId=null;canvas.style.cursor='grab';
}
document.addEventListener('pointerup',endCameraDrag);
document.addEventListener('pointercancel',e=>{
  mouseAction.punchHeld=false;mouseAction.kickHeld=false;endCameraDrag(e);
});
window.addEventListener('blur',()=>{mouseAction.punchHeld=false;mouseAction.kickHeld=false;dragCam=false;dragPointerId=null;});
document.addEventListener('pointerlockchange',()=>{
  const wasLocked=cameraLocked;cameraLocked=!!document.pointerLockElement;if(wasLocked&&!cameraLocked)cameraUnlockAt=performance.now();
  if(cameraLocked){dragCam=false;dragPointerId=null;}
  document.body.classList.toggle('pointer-locked',cameraLocked);
  if($('cameraLockBtn'))$('cameraLockBtn').textContent=cameraLocked?'🔓 UNLOCK MOUSE':'🔒 LOCK MOUSE';
  if($('cameraHint')&&state==='fight')setCameraHint(cameraLocked?'MOUSE LOOK ACTIVE · ESC TO UNLOCK':'HOLD MIDDLE MOUSE AND DRAG · USE LOCK MOUSE BUTTON FOR POINTER LOCK');
});
document.addEventListener('pointerlockerror',()=>{
  setCameraHint('POINTER LOCK BLOCKED BY THE BROWSER/PREVIEW · HOLD LEFT/RIGHT MOUSE AND DRAG OR OPEN THE DOWNLOADED HTML IN CHROME');
});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement)applyCameraLook(e.movementX||0,e.movementY||0)});
$('cameraLockBtn').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(document.pointerLockElement)document.exitPointerLock();else requestCameraLock()});
function updCam(dt){
  const alive=F.filter(f=>!f.ko),use=alive.length?alive:F;
  if(!use.length){camera.position.set(Math.sin(time*.15)*32,12,Math.cos(time*.15)*32);camera.lookAt(0,2,0);return}
  let cx=0,cz=0;use.forEach(f=>{cx+=f.x;cz+=f.z});cx/=use.length;cz/=use.length;
  let spread=0;use.forEach(f=>spread=Math.max(spread,Math.hypot(f.x-cx,f.z-cz)));
  const player=F.find(f=>f.human===0&&!f.ko)||F.find(f=>f.team==='A'&&!f.ko)||use[0];
  let target=new THREE.Vector3(cx,1.35,cz),offset;
  if(cfg.humans===1&&player){
    // Orbit around the player using a world-space yaw. Do not derive this from
    // player.yaw: the camera must stay where the mouse puts it while the avatar turns.
    const orbitDistance=9+spread*.32;
    offset=new THREE.Vector3(Math.sin(camYaw)*orbitDistance,0,Math.cos(camYaw)*orbitDistance);
    target.set(player.x,1.45+(player.jumpOffset||0)*.35,player.z);
  }else{
    offset=new THREE.Vector3(0,0,12+spread*1.15).applyAxisAngle(new THREE.Vector3(0,1,0),camYaw);
    target.set(cx,1.35,cz);
  }
  const dist=offset.length(),horizontal=offset.clone().multiplyScalar(Math.cos(camPitch));
  const desired=target.clone().add(horizontal);desired.y+=Math.sin(camPitch)*dist;
  camera.position.lerp(desired,Math.min(1,dt*5.2));
  look.lerp(target,Math.min(1,dt*6));
  if(shake>0){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.5)}
  camera.lookAt(look);
}
/* loop */
let last=performance.now();const idle={mx:0,mz:0,p:false,k:false,b:false,s:false};
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  stars.rotation.y+=dt*.004;beams.forEach(m=>{m.rotation.z=Math.sin(time*.6+m.userData.a*3)*.35;m.rotation.x=Math.cos(time*.5+m.userData.a*2)*.35});
  if(net&&screen==='lobby'){
    roomLobbyClock+=dt;
    if(roomLobbyClock>=.65){roomLobbyClock=0;const sig=onlineViewers().map(p=>String(p.peer)+':'+String((p.presence&&p.presence.c)||0)+':'+String(!!(p.presence&&p.presence.host))).sort().join('|');if(sig!==lastLobbySignature)lobby();}
  }
  if(!(paused&&!net)){
    if(state==='intro'){stT-=dt;if(stT<.6)banner('FIGHT!');if(stT<=0){state='fight';banner()}}
    else if(state==='end'){stT-=dt;if(stT<=0){round++;startRound()}}
    else if(state==='fight'&&!globalSuperFreezeActive())rt-=dt;
    F.forEach(f=>{const inp=state==='fight'&&!f.remote?(f.human>=0?humanInput(f.human):ai(f,dt)):idle;f.update(dt,inp)});
    for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){const a=F[i],b=F[j];if(a.ko||b.ko||a.remote||b.remote)continue;const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
      if(d<1.1){const n=d||.01,p=(1.1-d)/2;a.x-=dx/n*p;a.z-=dz/n*p;b.x+=dx/n*p;b.z+=dz/n*p}}
    F.forEach(f=>{if(f.remote)return;const r=Math.hypot(f.x,f.z);if(r>R-1){f.x*=(R-1)/r;f.z*=(R-1)/r}});
    if(state==='fight')checkRound();
    if(net&&F.length){onlinePublishClock+=dt;if(onlinePublishClock>=.066){onlinePublishClock=0;pub()}}}
  F.forEach((f,i)=>{if(bars[i])bars[i].style.width=f.hp+'%';if(specialBars[i])specialBars[i].style.width=f.sp+'%'});$('tm').textContent=Math.max(0,Math.ceil(rt));
  tickParts(dt);tickSpecials(dt);updCam(dt);ren.render(scene,camera)}
requestAnimationFrame(loop);
</script>
